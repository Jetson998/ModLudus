name: modludus

services:
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${MODLUDUS_API_URL:-http://localhost:8000}

  api:
    profiles: ["server"]
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-modludus}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-modludus}
    depends_on:
      - postgres
      - redis

  worker:
    profiles: ["server"]
    build: ./apps/api
    command: python -m app.worker
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis

  postgres:
    profiles: ["server"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modludus}
      POSTGRES_USER: ${POSTGRES_USER:-modludus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    profiles: ["server"]
    image: redis:7-alpine

  minio:
    profiles: ["server"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-modludus}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change-me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
